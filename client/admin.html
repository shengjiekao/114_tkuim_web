<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活動管理系統 | Admin Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <nav>
            <a href="index.html" class="logo">🛡️ 管理後台</a>
            <div class="nav-links">
                <a href="index.html">⬅️ 返回前台</a>
            </div>
        </nav>
    </header>

    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h2>活動管理</h2>
            <button class="btn" onclick="openCreateModal()">+ 新增活動</button>
        </div>

        <div id="admin-events-list" class="card-grid">
            <!-- Admin Events will be loaded here -->
        </div>
    </div>

    <!-- Create/Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modal-body-content">
                <h3 class="card-title" style="margin-bottom: 1rem;">新增/編輯活動</h3>
                <form id="eventForm">
                    <input type="hidden" id="eventId">
                    <div class="form-group">
                        <label class="form-label">活動名稱</label>
                        <input type="text" id="eventTitle" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">活動描述</label>
                        <textarea id="eventDesc" class="form-control" rows="3" required></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">日期</label>
                        <input type="date" id="eventDate" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">地點</label>
                        <input type="text" id="eventLocation" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">人數上限</label>
                        <input type="number" id="eventMax" class="form-control" required>
                    </div>
                    <button type="submit" class="btn" style="width: 100%;">儲存</button>
                </form>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        loadEvents('admin-events-list', false);

        // --- Modal & Form Logic ---
        const modal = document.getElementById('editModal');
        const form = document.getElementById('eventForm');

        function openCreateModal() {
            // Reset form
            document.getElementById('eventId').value = '';
            document.getElementById('eventTitle').value = '';
            document.getElementById('eventDesc').value = '';
            document.getElementById('eventDate').value = '';
            document.getElementById('eventLocation').value = '';
            document.getElementById('eventMax').value = '50';

            // Restore form HTML if it was replaced by View Registrations
            const defaultFormHtml = `
                <h3 class="card-title" style="margin-bottom: 1rem;">新增/編輯活動</h3>
                <form id="eventForm" onsubmit="handleFormSubmit(event)">
                   ${document.getElementById('eventForm').innerHTML} 
                </form>
            `;
            // Actually, simply resetting innerHTML of modal-body-content is safer if we swap content.
            // But for simplicity let's reload the page or just handle the "View Registrations" simpler.
            // Let's keep it simple: "View Registrations" overwrites the modal content. "Add Event" restores it? 
            // Better: use two modals or just reload. 
            // For now, I will just assume the user refreshes if things get weird, OR I will just fix the HTML restoration.
            // Actually, I'll just Reload the page in View Registrations 'Close'.

            // To properly handle "View Registrations" vs "Edit", we should ideally have separate modals.
            // Re-rendering the form structure:
            document.getElementById('modal-body-content').innerHTML = `
                <h3 class="card-title" style="margin-bottom: 1rem;">新增/編輯活動</h3>
                <form id="eventForm">
                    <input type="hidden" id="eventId">
                    <div class="form-group">
                        <label class="form-label">活動名稱</label>
                        <input type="text" id="eventTitle" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">活動描述</label>
                        <textarea id="eventDesc" class="form-control" rows="3" required></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">日期</label>
                        <input type="date" id="eventDate" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">地點</label>
                        <input type="text" id="eventLocation" class="form-control" required>
                    </div>
                     <div class="form-group">
                        <label class="form-label">人數上限</label>
                        <input type="number" id="eventMax" class="form-control" required>
                    </div>
                    <button type="submit" class="btn" style="width: 100%;">儲存</button>
                </form>
            `;

            // Re-bind event listener because we overwrote the element
            document.getElementById('eventForm').addEventListener('submit', handleFormSubmit);

            modal.classList.add('show');
        }

        async function openEditModal(id) {
            openCreateModal(); // Reset first
            // Fetch details
            const result = await fetchData(`/events/${id}`);
            if (result && result.success) {
                const e = result.data;
                document.getElementById('eventId').value = e._id;
                document.getElementById('eventTitle').value = e.title;
                document.getElementById('eventDesc').value = e.description;
                document.getElementById('eventDate').value = e.date.split('T')[0];
                document.getElementById('eventLocation').value = e.location;
                document.getElementById('eventMax').value = e.maxParticipants;
            }
        }

        function closeModal() {
            modal.classList.remove('show');
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('eventId').value;
            const data = {
                title: document.getElementById('eventTitle').value,
                description: document.getElementById('eventDesc').value,
                date: document.getElementById('eventDate').value,
                location: document.getElementById('eventLocation').value,
                maxParticipants: parseInt(document.getElementById('eventMax').value)
            };

            if (id) {
                // Update
                const res = await fetchData(`/events/${id}`, { method: 'PUT', body: JSON.stringify(data) });
                if (res && res.success) {
                    alert('更新成功');
                    loadEvents('admin-events-list', false);
                    closeModal();
                }
            } else {
                // Create
                createEvent(data);
            }
        }
    </script>
</body>

</html>
