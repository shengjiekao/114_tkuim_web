<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>Week09 Signup Demo</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="p-4">
  <div class="container" style="max-width: 640px;">
    <h2 class="mb-3">報名表單</h2>

    <form id="signup-form" class="vstack gap-3">
      <div>
        <input id="name" name="name" class="form-control" placeholder="姓名" required>
        <p id="name-error" class="text-danger small error-text"></p>
      </div>

      <div>
        <input id="email" name="email" type="email"
               class="form-control" placeholder="Email" required>
        <p id="email-error" class="text-danger small error-text"></p>
      </div>

      <div>
        <input id="phone" name="phone"
               class="form-control" placeholder="手機號碼 (09 開頭)" required>
        <p id="phone-error" class="text-danger small error-text"></p>
      </div>

      <div>
        <input id="password" name="password" type="password"
               class="form-control" placeholder="密碼（至少 8 碼，英數混合）" required>
        <p id="password-error" class="text-danger small error-text"></p>
      </div>

      <div>
        <input id="confirmPassword" name="confirmPassword" type="password"
               class="form-control" placeholder="確認密碼" required>
        <p id="confirmPassword-error" class="text-danger small error-text"></p>
      </div>

      <div>
        <label class="form-label">興趣標籤（至少 1 項）</label>
        <div>
          <label class="me-3">
            <input type="checkbox" name="interests" value="前端"> 前端
          </label>
          <label class="me-3">
            <input type="checkbox" name="interests" value="後端"> 後端
          </label>
          <label>
            <input type="checkbox" name="interests" value="全端"> 全端
          </label>
        </div>
        <p id="interests-error" class="text-danger small error-text"></p>
      </div>

      <div>
        <label>
          <input type="checkbox" id="terms" name="terms">
          我已閱讀並同意服務條款
        </label>
        <p id="terms-error" class="text-danger small error-text"></p>
      </div>

      <div class="d-flex gap-2">
        <button id="submitBtn" class="btn btn-primary flex-fill" type="submit">
          送出報名
        </button>
        <button id="resetBtn" class="btn btn-secondary" type="reset">
          重設
        </button>
      </div>
    </form>

    <p id="global-message" class="mt-3"></p>

    <div class="mt-4">
      <button id="fetchListBtn" class="btn btn-outline-primary mb-2" type="button">
        查看報名清單
      </button>
      <pre id="signupList" class="bg-light border p-3 small"></pre>
    </div>
  </div>

  <script src="./signup_form.js" type="module"></script>
</body>
</html>
