<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校園活動報名系統 | Campus Events</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header>
    <nav>
      <a href="index.html" class="logo">
         校園活動系統
      </a>
      <div class="nav-links">
        <a href="#" onclick="showSection('events')"> 最新活動</a>
        <a href="#" onclick="showSection('my-registrations')"> 我的報名</a>
        <a href="admin.html"> 管理員</a>
        <div style="display: flex; align-items: center; gap: 10px;">
          <button id="loginBtn" class="btn btn-sm">模擬登入</button>
          <span id="userInfo" style="font-weight: 600; color: var(--primary-color);"></span>
        </div>
      </div>
    </nav>
  </header>

  <div class="container">
    <!-- Events Section -->
    <section id="events-section">
      <h2 style="margin-bottom: 20px;">最新活動</h2>
      <div id="events-list" class="card-grid">
        <!-- Events will be loaded here -->
      </div>
    </section>

    <!-- My Registrations Section -->
    <section id="my-registrations-section" style="display: none;">
      <h2 style="margin-bottom: 20px;">我的報名紀錄</h2>
      <div id="my-registrations-list" class="card-grid">
        <!-- Registrations will be loaded here -->
      </div>
    </section>
  </div>

  <script src="js/app.js"></script>
  <script>
    // --- Page Navigation ---
    function showSection(id) {
      document.getElementById('events-section').style.display = 'none';
      document.getElementById('my-registrations-section').style.display = 'none';
      document.getElementById(id + '-section').style.display = 'block';

      if (id === 'events') loadEvents('events-list', true);
      if (id === 'my-registrations') {
        const userId = localStorage.getItem('userId');
        if (userId) loadMyRegistrations(userId);
        else {
          alert("請先登入");
          showSection('events');
        }
      }
    }

    // --- Mock Login Logic ---
    const loginBtn = document.getElementById('loginBtn');
    const userInfo = document.getElementById('userInfo');

    function updateLoginState() {
      const userId = localStorage.getItem('userId');
      const userName = localStorage.getItem('userName');
      if (userId) {
        loginBtn.textContent = '登出';
        userInfo.textContent = `Hi, ${userName}`;
      } else {
        loginBtn.textContent = '模擬登入';
        userInfo.textContent = '';
      }
    }

    loginBtn.addEventListener('click', async () => {
      const userId = localStorage.getItem('userId');
      if (userId) {
        // Logout
        localStorage.removeItem('userId');
        localStorage.removeItem('userName');
        alert('已登出');
        updateLoginState();
        showSection('events');
      } else {
        const name = prompt("請輸入您的姓名:");
        const email = prompt("請輸入您的 Email:");
        if (name && email) {
          try {
            const res = await fetch('http://localhost:3000/api/users', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name, email, role: 'user' })
            });
            const data = await res.json();
            if (data.success) {
              localStorage.setItem('userId', data.data._id);
              localStorage.setItem('userName', data.data.name);
              updateLoginState();
              alert('登入成功！');
            } else {
              alert('登入失敗: ' + data.message);
            }
          } catch (e) {
            alert('Error: ' + e.message);
          }
        }
      }
    });

    // Initialize
    updateLoginState();
    loadEvents('events-list', true);
  </script>
</body>

</html>
