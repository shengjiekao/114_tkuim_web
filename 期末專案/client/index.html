<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校園活動報名系統 | Campus Events</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header>
    <nav>
      <a href="index.html" class="logo">
        校園活動系統
      </a>
      <div class="nav-links">
        <a href="#" onclick="showSection('events')">最新活動</a>
        <a href="#" onclick="showSection('my-registrations')">我的報名</a>

        <div style="display: flex; align-items: center; gap: 10px;">
          <button id="loginBtn" class="btn btn-sm">登入 / 註冊</button>
          <span id="userInfo" style="font-weight: 600; color: var(--primary-color);"></span>
        </div>
      </div>
    </nav>
  </header>

  <div class="hero">
    <div class="hero-content">
      <h1>探索校園活動</h1>
      <p>豐富你的校園生活，立即報名參加最新活動！</p>
      <button class="btn btn-lg btn-light"
        onclick="document.getElementById('events-section').scrollIntoView({behavior: 'smooth'})">立即探索</button>
    </div>
  </div>

  <div class="container">
    <!-- Events Section -->
    <section id="events-section">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2>最新活動</h2>
        <button id="createEventBtn" class="btn" onclick="openCreateModal()" style="display: none;">+ 新增活動</button>
      </div>
      <div id="events-list" class="card-grid">
        <!-- Events will be loaded here -->
      </div>
    </section>

    <!-- My Registrations Section -->
    <section id="my-registrations-section" style="display: none;">
      <h2 style="margin-bottom: 20px;">我的報名紀錄</h2>
      <div id="my-registrations-list" class="card-grid">
        <!-- Registrations will be loaded here -->
      </div>
    </section>

    <!-- Create/Edit Modal -->
    <div id="editModal" class="modal">
      <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <div id="modal-body-content">
          <h3 class="card-title" style="margin-bottom: 1rem;">新增/編輯活動</h3>
          <form id="eventForm">
            <input type="hidden" id="eventId">
            <div class="form-group">
              <label class="form-label">活動名稱</label>
              <input type="text" id="eventTitle" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label">活動描述</label>
              <textarea id="eventDesc" class="form-control" rows="3" required></textarea>
            </div>
            <div class="form-group">
              <label class="form-label">活動圖片 URL</label>
              <input type="url" id="eventImage" class="form-control" placeholder="https://example.com/image.jpg">
            </div>
            <div class="form-group">
              <label class="form-label">日期</label>
              <input type="date" id="eventDate" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label">地點</label>
              <input type="text" id="eventLocation" class="form-control" required>
            </div>

            <!-- View Registrations Modal -->
            <div id="viewRegistrationsModal" class="modal">
              <div class="modal-content">
                <span class="close" onclick="closeViewModal()">&times;</span>
                <h3 class="card-title" style="margin-bottom: 1rem;">報名名單</h3>
                <div id="registrations-list-content">
                  <!-- List will be injected here -->
                </div>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">人數上限</label>
              <input type="number" id="eventMax" class="form-control" required>
            </div>
            <button type="submit" class="btn" style="width: 100%;">儲存</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Login Modal -->
  <div id="loginModal" class="modal">
    <div class="modal-content" style="max-width: 400px;">
      <span class="close" onclick="closeAuthModals()">&times;</span>
      <h3 class="card-title">會員登入</h3>
      <form id="loginForm">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="loginEmail" class="form-control" required>
        </div>
        <div class="form-group">
          <label class="form-label">密碼</label>
          <input type="password" id="loginPassword" class="form-control" required>
        </div>
        <button type="submit" class="btn" style="width: 100%;">登入</button>
        <p style="margin-top: 1rem; text-align: center; font-size: 0.9rem;">
          還沒帳號？ <a href="#" onclick="switchModal('register')" style="color: var(--primary-color);">立即註冊</a>
        </p>
      </form>
    </div>
  </div>

  <!-- Register Modal -->
  <div id="registerModal" class="modal">
    <div class="modal-content" style="max-width: 400px;">
      <span class="close" onclick="closeAuthModals()">&times;</span>
      <h3 class="card-title">註冊帳號</h3>
      <form id="registerForm">
        <div class="form-group">
          <label class="form-label">姓名</label>
          <input type="text" id="regName" class="form-control" required>
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="regEmail" class="form-control" required>
        </div>
        <div class="form-group">
          <label class="form-label">密碼</label>
          <input type="password" id="regPassword" class="form-control" required>
        </div>
        <div class="form-group">
          <label class="form-label">身分</label>
          <select id="regRole" class="form-control">
            <option value="user">學生 (Student)</option>
            <option value="admin">管理員 (Admin)</option>
          </select>
        </div>
        <button type="submit" class="btn" style="width: 100%;">註冊</button>
        <p style="margin-top: 1rem; text-align: center; font-size: 0.9rem;">
          已有帳號？ <a href="#" onclick="switchModal('login')" style="color: var(--primary-color);">登入</a>
        </p>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    // --- Page Navigation ---
    // --- Page Navigation ---
    function showSection(id) {
      document.getElementById('events-section').style.display = 'none';
      document.getElementById('my-registrations-section').style.display = 'none';
      document.getElementById(id + '-section').style.display = 'block';

      // Update Active State
      document.querySelectorAll('.nav-links a').forEach(link => link.classList.remove('active'));
      const activeLink = document.querySelector(`.nav-links a[onclick="showSection('${id}')"]`);
      if (activeLink) activeLink.classList.add('active');

      if (id === 'events') {
        // events are loaded via updateUI or manual refresh
        loadEvents('events-list', !currentUser || currentUser.role !== 'admin');
      }
      if (id === 'my-registrations') {
        if (currentUser) loadMyRegistrations(currentUser.id);
        else {
          alert('請先登入');
          openLoginModal();
          showSection('events');
        }
      }
    }

    // --- Modal Binding ---
    const modal = document.getElementById('editModal');
    function openCreateModal() {
      document.getElementById('eventId').value = '';
      document.getElementById('eventTitle').value = '';
      document.getElementById('eventDesc').value = '';
      document.getElementById('eventDate').value = '';
      document.getElementById('eventLocation').value = '';
      document.getElementById('eventMax').value = '50';
      modal.classList.add('show');
    }

    async function openEditModal(id) {
      openCreateModal();
      const result = await fetchData(`/events/${id}`);
      if (result && result.success) {
        const e = result.data;
        document.getElementById('eventId').value = e._id;
        document.getElementById('eventTitle').value = e.title;
        document.getElementById('eventDesc').value = e.description; // e.desc ?
        document.getElementById('eventDate').value = e.date ? e.date.split('T')[0] : '';
        document.getElementById('eventLocation').value = e.location;
        document.getElementById('eventMax').value = e.maxParticipants;
      }
    }

    function closeModal() {
      modal.classList.remove('show');
    }

    // Bind Forms
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      login(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value);
    });

    document.getElementById('registerForm').addEventListener('submit', (e) => {
      e.preventDefault();
      register(
        document.getElementById('regName').value,
        document.getElementById('regEmail').value,
        document.getElementById('regPassword').value,
        document.getElementById('regRole').value
      );
    });

    document.getElementById('eventForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const id = document.getElementById('eventId').value;
      const data = {
        title: document.getElementById('eventTitle').value,
        description: document.getElementById('eventDesc').value,
        date: document.getElementById('eventDate').value,
        location: document.getElementById('eventLocation').value,
        image: document.getElementById('eventImage').value,
        maxParticipants: parseInt(document.getElementById('eventMax').value)
      };

      if (id) { // Update
        fetchData(`/events/${id}`, { method: 'PUT', body: JSON.stringify(data) }).then(res => {
          if (res.success) { alert('更新成功'); closeModal(); loadEvents('events-list', currentUser.role !== 'admin'); }
        });
      } else { // Create
        createEvent(data);
      }
    });

    // Init
    // Init
    document.addEventListener('DOMContentLoaded', () => {
      initAuth();
    });

  </script>
</body>

</html>
